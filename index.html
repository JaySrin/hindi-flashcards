<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hindi Cards" />
  <meta name="theme-color" content="#0f172a" />
  <title>Spoken Hindi Flashcard Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .perspective-1000 {
      perspective: 1000px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const INITIAL_CARDS = [
      { id: 1, en: "How are you? (Polite)", hiRoman: "Aap kaise hain?", hiDeva: "आप कैसे हैं?", week: "Week 1", day: "Day 1", category: "Identity & Greetings", snoozeUntil: null, masteredCount: 0 },
      { id: 2, en: "I am completely fine.", hiRoman: "Main bilkul theek hoon.", hiDeva: "मैं बिल्कुल ठीक हूँ।", week: "Week 1", day: "Day 1", category: "Identity & Greetings", snoozeUntil: null, masteredCount: 0 },
      { id: 3, en: "What is your name?", hiRoman: "Aapka naam kya hai?", hiDeva: "आपका नाम क्या है?", week: "Week 1", day: "Day 2", category: "Questions (Kya/Kahan)", snoozeUntil: null, masteredCount: 0 },
      { id: 4, en: "What is this?", hiRoman: "Yeh kya hai?", hiDeva: "यह क्या है?", week: "Week 1", day: "Day 2", category: "Questions (Kya/Kahan)", snoozeUntil: null, masteredCount: 0 },
      { id: 5, en: "This is my house.", hiRoman: "Yeh mera ghar hai.", hiDeva: "यह मेरा घर है।", week: "Week 1", day: "Day 1", category: "Identity & Greetings", snoozeUntil: null, masteredCount: 0 },
      { id: 6, en: "That is my car.", hiRoman: "Woh meri gaadi hai.", hiDeva: "वह मेरी गाड़ी है।", week: "Week 1", day: "Day 1", category: "Identity & Greetings", snoozeUntil: null, masteredCount: 0 },
      { id: 7, en: "Where is my phone?", hiRoman: "Mera phone kahan hai?", hiDeva: "मेरा फ़ोन कहाँ है?", week: "Week 1", day: "Day 2", category: "Questions (Kya/Kahan)", snoozeUntil: null, masteredCount: 0 },
      { id: 8, en: "Your phone is on the table.", hiRoman: "Aapka phone table par hai.", hiDeva: "आपका फ़ोन टेबल पर है।", week: "Week 1", day: "Day 2", category: "Questions (Kya/Kahan)", snoozeUntil: null, masteredCount: 0 },
      { id: 9, en: "Where are you right now?", hiRoman: "Aap abhi kahan hain?", hiDeva: "आप अभी कहाँ हैं?", week: "Week 1", day: "Day 2", category: "Questions (Kya/Kahan)", snoozeUntil: null, masteredCount: 0 },
      { id: 10, en: "I am here, at home.", hiRoman: "Main yahan hoon, ghar par.", hiDeva: "मैं यहाँ हूँ, घर पर।", week: "Week 1", day: "Day 2", category: "Questions (Kya/Kahan)", snoozeUntil: null, masteredCount: 0 },
      { id: 11, en: "Are you busy right now?", hiRoman: "Kya aap abhi busy hain?", hiDeva: "क्या आप अभी बिज़ी हैं?", week: "Week 1", day: "Day 3", category: "Yes/No & Negation", snoozeUntil: null, masteredCount: 0 },
      { id: 12, en: "No, I am not busy.", hiRoman: "Nahi, main busy nahi hoon.", hiDeva: "नहीं, मैं बिज़ी नहीं हूँ।", week: "Week 1", day: "Day 3", category: "Yes/No & Negation", snoozeUntil: null, masteredCount: 0 },
      { id: 13, en: "Is this your coffee?", hiRoman: "Kya yeh aapki coffee hai?", hiDeva: "क्या यह आपकी कॉफ़ी है?", week: "Week 1", day: "Day 3", category: "Yes/No & Negation", snoozeUntil: null, masteredCount: 0 },
      { id: 14, en: "No, this is not mine.", hiRoman: "Nahi, yeh meri nahi hai.", hiDeva: "नहीं, यह मेरी नहीं है।", week: "Week 1", day: "Day 3", category: "Yes/No & Negation", snoozeUntil: null, masteredCount: 0 },
      { id: 15, en: "Who is that?", hiRoman: "Woh kaun hai?", hiDeva: "वह कौन है?", week: "Week 1", day: "Day 4", category: "Time, Reason & People", snoozeUntil: null, masteredCount: 0 },
      { id: 16, en: "He is my friend.", hiRoman: "Woh mera dost hai.", hiDeva: "वह मेरा दोस्त है।", week: "Week 1", day: "Day 4", category: "Time, Reason & People", snoozeUntil: null, masteredCount: 0 },
      { id: 17, en: "When is the meeting?", hiRoman: "Meeting kab hai?", hiDeva: "मीटिंग कब है?", week: "Week 1", day: "Day 4", category: "Time, Reason & People", snoozeUntil: null, masteredCount: 0 },
      { id: 18, en: "The meeting is tomorrow morning.", hiRoman: "Meeting kal subah hai.", hiDeva: "मीटिंग कल सुबह है।", week: "Week 1", day: "Day 4", category: "Time, Reason & People", snoozeUntil: null, masteredCount: 0 },
      { id: 19, en: "Why are you late?", hiRoman: "Aap late kyun hain?", hiDeva: "आप लेट क्यों हैं?", week: "Week 1", day: "Day 4", category: "Time, Reason & People", snoozeUntil: null, masteredCount: 0 },
      { id: 20, en: "Please take this.", hiRoman: "Yeh lijiye.", hiDeva: "यह लीजिए।", week: "Week 1", day: "Day 5", category: "Polite Commands", snoozeUntil: null, masteredCount: 0 },
      { id: 21, en: "Please give me some water.", hiRoman: "Mujhe thoda paani dijiye.", hiDeva: "मुझे थोड़ा पानी दीजिए।", week: "Week 1", day: "Day 5", category: "Polite Commands", snoozeUntil: null, masteredCount: 0 },
      { id: 22, en: "Please drink tea.", hiRoman: "Chai pijiye.", hiDeva: "चाय पीजिए।", week: "Week 1", day: "Day 5", category: "Polite Commands", snoozeUntil: null, masteredCount: 0 },
      { id: 23, en: "Please call me in the evening.", hiRoman: "Mujhe shaam ko call kijiye.", hiDeva: "मुझे शाम को कॉल कीजिए।", week: "Week 1", day: "Day 5", category: "Polite Commands", snoozeUntil: null, masteredCount: 0 },
      { id: 24, en: "Do you need anything?", hiRoman: "Kya aapko kuch chahiye?", hiDeva: "क्या आपको कुछ चाहिए?", week: "Week 1", day: "Day 6", category: "Needs (Chahiye)", snoozeUntil: null, masteredCount: 0 },
      { id: 25, en: "No, I just need a little time.", hiRoman: "Nahi, mujhe bas thoda time chahiye.", hiDeva: "नहीं, मुझे बस थोड़ा टाइम चाहिए।", week: "Week 1", day: "Day 6", category: "Needs (Chahiye)", snoozeUntil: null, masteredCount: 0 }
    ];

    const STORAGE_KEY = "spoken_hindi_flashcard_studio_v1";

    function App() {
      const [cards, setCards] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          return saved ? JSON.parse(saved) : INITIAL_CARDS;
        } catch (e) {
          return INITIAL_CARDS;
        }
      });

      const [activeTab, setActiveTab] = useState("practice"); // practice | snoozed | manage | add
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [selectedWeek, setSelectedWeek] = useState("All");
      const [selectedCategory, setSelectedCategory] = useState("All");
      const [showSnoozeMenu, setShowSnoozeMenu] = useState(false);
      const [simulatedOffsetDays, setSimulatedOffsetDays] = useState(0);

      // 3-Second Pace Timer
      const [paceEnabled, setPaceEnabled] = useState(true);
      const [paceProgress, setPaceProgress] = useState(0);

      // Add Card Form
      const [newEn, setNewEn] = useState("");
      const [newHiRoman, setNewHiRoman] = useState("");
      const [newHiDeva, setNewHiDeva] = useState("");
      const [newWeek, setNewWeek] = useState("Week 1");
      const [newCategory, setNewCategory] = useState("Custom");
      const [bulkText, setBulkText] = useState("");
      const [statusMsg, setStatusMsg] = useState("");

      const fileInputRef = useRef(null);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
        } catch (e) {
          console.error("Failed to save to localStorage", e);
        }
      }, [cards]);

      const nowMs = Date.now() + simulatedOffsetDays * 86400000;

      const isCardSnoozed = (card) => {
        if (!card.snoozeUntil) return false;
        if (card.snoozeUntil === "indefinite") return true;
        return card.snoozeUntil > nowMs;
      };

      const activeCards = cards.filter((c) => {
        if (isCardSnoozed(c)) return false;
        if (selectedWeek !== "All" && c.week !== selectedWeek) return false;
        if (selectedCategory !== "All" && c.category !== selectedCategory) return false;
        return true;
      });

      const snoozedCards = cards.filter((c) => isCardSnoozed(c));

      const weeks = ["All", ...Array.from(new Set(cards.map((c) => c.week)))];
      const categories = ["All", ...Array.from(new Set(cards.map((c) => c.category)))];

      const currentCard = activeCards[currentIndex] || null;

      // Handle 3-second pace timer
      useEffect(() => {
        if (!paceEnabled || isFlipped || !currentCard || activeTab !== "practice") {
          setPaceProgress(0);
          return;
        }
        setPaceProgress(0);
        const start = Date.now();
        const interval = setInterval(() => {
          const elapsed = Date.now() - start;
          const pct = Math.min(100, (elapsed / 3000) * 100);
          setPaceProgress(pct);
          if (pct >= 100) clearInterval(interval);
        }, 50);
        return () => clearInterval(interval);
      }, [currentIndex, isFlipped, paceEnabled, currentCard?.id, activeTab]);

      const speakHindi = (textDeva, textRoman, e) => {
        if (e) e.stopPropagation();
        if (!("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(textDeva || textRoman);
        utter.lang = "hi-IN";
        utter.rate = 0.92;
        window.speechSynthesis.speak(utter);
      };

      const nextCard = () => {
        setIsFlipped(false);
        setShowSnoozeMenu(false);
        if (activeCards.length > 0) {
          setCurrentIndex((prev) => (prev + 1) % activeCards.length);
        }
      };

      const prevCard = () => {
        setIsFlipped(false);
        setShowSnoozeMenu(false);
        if (activeCards.length > 0) {
          setCurrentIndex((prev) => (prev - 1 + activeCards.length) % activeCards.length);
        }
      };

      const shuffleDeck = () => {
        setIsFlipped(false);
        setShowSnoozeMenu(false);
        setCards((prev) => [...prev].sort(() => Math.random() - 0.5));
        setCurrentIndex(0);
      };

      const snoozeCard = (cardId, days) => {
        const until = days === "indefinite" ? "indefinite" : nowMs + days * 86400000;
        setCards((prev) =>
          prev.map((c) =>
            c.id === cardId
              ? { ...c, snoozeUntil: until, masteredCount: (c.masteredCount || 0) + 1 }
              : c
          )
        );
        setIsFlipped(false);
        setShowSnoozeMenu(false);
        if (currentIndex >= activeCards.length - 1) {
          setCurrentIndex(0);
        }
      };

      const restoreCard = (cardId) => {
        setCards((prev) =>
          prev.map((c) => (c.id === cardId ? { ...c, snoozeUntil: null } : c))
        );
      };

      const handleAddSingle = (e) => {
        e.preventDefault();
        if (!newEn.trim() || !newHiRoman.trim()) return;
        const newCard = {
          id: Date.now(),
          en: newEn.trim(),
          hiRoman: newHiRoman.trim(),
          hiDeva: newHiDeva.trim() || newHiRoman.trim(),
          week: newWeek.trim() || "Custom",
          day: "Custom",
          category: newCategory.trim() || "Custom",
          snoozeUntil: null,
          masteredCount: 0
        };
        setCards((prev) => [...prev, newCard]);
        setNewEn("");
        setNewHiRoman("");
        setNewHiDeva("");
        flashStatus("Added new flashcard to deck!");
      };

      const handleBulkImport = () => {
        if (!bulkText.trim()) return;
        const lines = bulkText.split("\n").map((l) => l.trim()).filter(Boolean);
        const added = [];
        lines.forEach((line, idx) => {
          const parts = line.split("|").map((p) => p.trim());
          if (parts.length >= 2) {
            added.push({
              id: Date.now() + idx,
              en: parts[0],
              hiRoman: parts[1],
              hiDeva: parts[2] || parts[1],
              week: parts[3] || "Week 2",
              day: "Custom",
              category: parts[4] || "Custom",
              snoozeUntil: null,
              masteredCount: 0
            });
          }
        });
        if (added.length > 0) {
          setCards((prev) => [...prev, ...added]);
          setBulkText("");
          flashStatus(`Imported ${added.length} cards!`);
        }
      };

      const deleteCard = (id) => {
        setCards((prev) => prev.filter((c) => c.id !== id));
      };

      const exportJSON = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cards, null, 2));
        const dlAnchor = document.createElement("a");
        dlAnchor.setAttribute("href", dataStr);
        dlAnchor.setAttribute("download", `hindi_flashcards_backup_${new Date().toISOString().slice(0, 10)}.json`);
        document.body.appendChild(dlAnchor);
        dlAnchor.click();
        dlAnchor.remove();
      };

      const importJSON = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (Array.isArray(parsed)) {
              setCards(parsed);
              flashStatus(`Restored ${parsed.length} cards from backup!`);
            }
          } catch (err) {
            alert("Invalid JSON backup file.");
          }
        };
        reader.readAsText(file);
      };

      const flashStatus = (msg) => {
        setStatusMsg(msg);
        setTimeout(() => setStatusMsg(""), 3000);
      };

      const formatRemainingDays = (snoozeUntil) => {
        if (snoozeUntil === "indefinite") return "Hidden Indefinitely";
        const diffDays = Math.ceil((snoozeUntil - nowMs) / 86400000);
        return diffDays <= 0 ? "Returning now" : `Returns in ${diffDays} day${diffDays === 1 ? "" : "s"}`;
      };

      return (
        <div className="max-w-3xl mx-auto px-4 py-6 pb-20">
          {/* Header */}
          <header className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 border-b border-slate-800 pb-4 mb-6">
            <div>
              <div className="flex items-center gap-2">
                <span className="bg-amber-500 text-slate-950 font-bold text-xs px-2.5 py-1 rounded-full uppercase tracking-wider">15-Min Plan</span>
                <h1 className="text-xl sm:text-2xl font-bold text-white">Spoken Hindi Flashcard Studio</h1>
              </div>
              <p className="text-xs sm:text-sm text-slate-400 mt-1">
                Active Deck: <strong className="text-amber-400">{activeCards.length}</strong> cards · Snoozed Vault: <strong className="text-emerald-400">{snoozedCards.length}</strong> cards
                {simulatedOffsetDays > 0 && (
                  <span className="ml-2 text-indigo-400 font-medium">(+{simulatedOffsetDays}d simulated)</span>
                )}
              </p>
            </div>

            {/* Backup Controls */}
            <div className="flex flex-wrap items-center gap-2">
              <button
                onClick={exportJSON}
                className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 transition"
              >
                Export JSON
              </button>
              <button
                onClick={() => fileInputRef.current?.click()}
                className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 transition"
              >
                Restore JSON
              </button>
              <input
                ref={fileInputRef}
                type="file"
                accept=".json"
                onChange={importJSON}
                className="hidden"
              />
            </div>
          </header>

          {statusMsg && (
            <div className="mb-4 bg-emerald-900/60 border border-emerald-500 text-emerald-200 px-4 py-2 rounded-xl text-sm">
              {statusMsg}
            </div>
          )}

          {/* Navigation Tabs */}
          <div className="grid grid-cols-4 gap-2 bg-slate-900 p-1.5 rounded-xl border border-slate-800 mb-6">
            <button
              onClick={() => setActiveTab("practice")}
              className={`py-2 px-3 rounded-lg text-xs sm:text-sm font-medium transition ${
                activeTab === "practice" ? "bg-amber-500 text-slate-950 font-semibold" : "text-slate-400 hover:text-white"
              }`}
            >
              Practice ({activeCards.length})
            </button>
            <button
              onClick={() => setActiveTab("snoozed")}
              className={`py-2 px-3 rounded-lg text-xs sm:text-sm font-medium transition ${
                activeTab === "snoozed" ? "bg-amber-500 text-slate-950 font-semibold" : "text-slate-400 hover:text-white"
              }`}
            >
              Snoozed ({snoozedCards.length})
            </button>
            <button
              onClick={() => setActiveTab("add")}
              className={`py-2 px-3 rounded-lg text-xs sm:text-sm font-medium transition ${
                activeTab === "add" ? "bg-amber-500 text-slate-950 font-semibold" : "text-slate-400 hover:text-white"
              }`}
            >
              + Add Cards
            </button>
            <button
              onClick={() => setActiveTab("manage")}
              className={`py-2 px-3 rounded-lg text-xs sm:text-sm font-medium transition ${
                activeTab === "manage" ? "bg-amber-500 text-slate-950 font-semibold" : "text-slate-400 hover:text-white"
              }`}
            >
              All ({cards.length})
            </button>
          </div>

          {/* PRACTICE TAB */}
          {activeTab === "practice" && (
            <div>
              {/* Filters & Pace Toggle */}
              <div className="flex flex-wrap items-center justify-between gap-2 mb-4 bg-slate-900/70 p-3 rounded-xl border border-slate-800/80">
                <div className="flex flex-wrap items-center gap-2">
                  <select
                    value={selectedWeek}
                    onChange={(e) => { setSelectedWeek(e.target.value); setCurrentIndex(0); setIsFlipped(false); }}
                    className="bg-slate-800 text-xs text-slate-200 rounded-lg px-2.5 py-1.5 border border-slate-700"
                  >
                    {weeks.map((w) => <option key={w} value={w}>{w === "All" ? "All Weeks" : w}</option>)}
                  </select>
                  <select
                    value={selectedCategory}
                    onChange={(e) => { setSelectedCategory(e.target.value); setCurrentIndex(0); setIsFlipped(false); }}
                    className="bg-slate-800 text-xs text-slate-200 rounded-lg px-2.5 py-1.5 border border-slate-700"
                  >
                    {categories.map((cat) => <option key={cat} value={cat}>{cat === "All" ? "All Categories" : cat}</option>)}
                  </select>
                  <button
                    onClick={shuffleDeck}
                    className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1.5 rounded-lg border border-slate-700"
                  >
                    Shuffle
                  </button>
                </div>

                <label className="flex items-center gap-2 text-xs text-slate-300 cursor-pointer">
                  <input
                    type="checkbox"
                    checked={paceEnabled}
                    onChange={(e) => setPaceEnabled(e.target.checked)}
                    className="rounded accent-amber-500"
                  />
                  3-Sec Reflex Bar
                </label>
              </div>

              {activeCards.length === 0 ? (
                <div className="text-center py-14 bg-slate-900 rounded-2xl border border-slate-800 p-6">
                  <p className="text-lg font-semibold text-white mb-2">All cards in this filter are snoozed or empty!</p>
                  <p className="text-sm text-slate-400 mb-4">
                    Check the Snoozed Vault to restore cards or simulate time forward.
                  </p>
                  <button
                    onClick={() => setActiveTab("snoozed")}
                    className="bg-amber-500 text-slate-950 font-semibold px-4 py-2 rounded-xl text-sm"
                  >
                    Open Snoozed Vault ({snoozedCards.length})
                  </button>
                </div>
              ) : (
                <div>
                  {/* Flashcard Box */}
                  <div
                    onClick={() => setIsFlipped(!isFlipped)}
                    className="relative cursor-pointer select-none rounded-2xl bg-gradient-to-br from-slate-900 via-slate-900 to-slate-800 border-2 border-slate-700 hover:border-amber-500/60 transition-all p-6 sm:p-10 min-h-[290px] flex flex-col justify-between shadow-2xl"
                  >
                    {/* Top Bar inside Card */}
                    <div className="flex items-center justify-between text-xs text-slate-400">
                      <span className="bg-slate-800 px-2.5 py-1 rounded-md border border-slate-700 text-slate-300">
                        {currentCard.week} · {currentCard.category}
                      </span>
                      <span>
                        Card {currentIndex + 1} of {activeCards.length}
                      </span>
                    </div>

                    {/* 3-Second Reflex Bar */}
                    {paceEnabled && !isFlipped && (
                      <div className="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden my-3">
                        <div
                          className={`h-full transition-all duration-75 ${
                            paceProgress < 75 ? "bg-amber-400" : "bg-rose-500"
                          }`}
                          style={{ width: `${paceProgress}%` }}
                        />
                      </div>
                    )}

                    {/* Center Prompt / Answer */}
                    <div className="my-6 text-center">
                      {!isFlipped ? (
                        <div>
                          <p className="text-xs uppercase tracking-widest text-amber-400 mb-2 font-semibold">
                            Speak Out Loud in Hindi
                          </p>
                          <h2 className="text-2xl sm:text-3xl font-bold text-white leading-snug">
                            {currentCard.en}
                          </h2>
                          {paceProgress >= 100 && (
                            <p className="text-xs text-rose-400 mt-3 animate-pulse">
                              3 seconds up — tap card to check!
                            </p>
                          )}
                        </div>
                      ) : (
                        <div>
                          <p className="text-xs uppercase tracking-widest text-emerald-400 mb-1 font-semibold">
                            Spoken Hindi
                          </p>
                          <h2 className="text-2xl sm:text-4xl font-extrabold text-amber-300 mb-3">
                            {currentCard.hiRoman}
                          </h2>
                          <p className="text-xl sm:text-2xl text-slate-200 font-medium mb-4">
                            {currentCard.hiDeva}
                          </p>
                          <button
                            onClick={(e) => speakHindi(currentCard.hiDeva, currentCard.hiRoman, e)}
                            className="inline-flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-amber-300 text-xs font-semibold px-4 py-2 rounded-full border border-slate-600 transition"
                          >
                            <span>🔊 Listen (Hindi Audio)</span>
                          </button>
                        </div>
                      )}
                    </div>

                    {/* Footer Hint */}
                    <div className="text-center text-xs text-slate-500">
                      {isFlipped ? "Tap anywhere on card to flip back to English" : "Tap anywhere on card to reveal Hindi"}
                    </div>
                  </div>

                  {/* Navigation & Snooze Bar */}
                  <div className="mt-5 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
                    <div className="flex items-center gap-2">
                      <button
                        onClick={prevCard}
                        className="flex-1 sm:flex-initial bg-slate-800 hover:bg-slate-700 text-white px-5 py-3 rounded-xl font-medium text-sm border border-slate-700 transition"
                      >
                        ← Prev
                      </button>
                      <button
                        onClick={() => setIsFlipped(!isFlipped)}
                        className="flex-1 sm:flex-initial bg-slate-800 hover:bg-slate-700 text-amber-300 px-5 py-3 rounded-xl font-medium text-sm border border-slate-700 transition"
                      >
                        {isFlipped ? "Show Front" : "Flip Card"}
                      </button>
                      <button
                        onClick={nextCard}
                        className="flex-1 sm:flex-initial bg-amber-500 hover:bg-amber-400 text-slate-950 px-6 py-3 rounded-xl font-bold text-sm transition"
                      >
                        Next →
                      </button>
                    </div>

                    {/* Snooze Button */}
                    <div className="relative">
                      <button
                        onClick={() => setShowSnoozeMenu(!showSnoozeMenu)}
                        className="w-full sm:w-auto bg-emerald-950/80 hover:bg-emerald-900 text-emerald-300 border border-emerald-700/70 px-4 py-3 rounded-xl text-xs sm:text-sm font-semibold transition"
                      >
                        ✓ Comfortable — Hide / Snooze
                      </button>

                      {showSnoozeMenu && (
                        <div className="absolute right-0 bottom-14 w-64 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl p-2 z-20">
                          <p className="text-xs text-slate-400 px-2 py-1 border-b border-slate-800 mb-1">
                            Bring back to active deck after:
                          </p>
                          {[
                            { label: "1 Week (7 days)", days: 7 },
                            { label: "2 Weeks (14 days)", days: 14 },
                            { label: "3 Weeks (21 days)", days: 21 },
                            { label: "1 Month (30 days)", days: 30 },
                            { label: "Hide Indefinitely", days: "indefinite" }
                          ].map((opt) => (
                            <button
                              key={opt.label}
                              onClick={() => snoozeCard(currentCard.id, opt.days)}
                              className="w-full text-left text-xs sm:text-sm text-slate-200 hover:bg-amber-500 hover:text-slate-950 px-3 py-2 rounded-lg transition font-medium"
                            >
                              {opt.label}
                            </button>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* SNOOZED VAULT TAB */}
          {activeTab === "snoozed" && (
            <div className="bg-slate-900 rounded-2xl border border-slate-800 p-5">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 mb-4 border-b border-slate-800">
                <div>
                  <h2 className="text-lg font-bold text-white">Snoozed Cards Vault</h2>
                  <p className="text-xs text-slate-400">
                    Cards you marked comfortable stay hidden here and automatically return when their timer expires.
                  </p>
                </div>
                <div className="flex items-center gap-2">
                  <button
                    onClick={() => setSimulatedOffsetDays((d) => d + 7)}
                    className="text-xs bg-indigo-950 hover:bg-indigo-900 text-indigo-300 border border-indigo-700 px-3 py-1.5 rounded-lg"
                  >
                    Simulate +1 Week
                  </button>
                  {simulatedOffsetDays > 0 && (
                    <button
                      onClick={() => setSimulatedOffsetDays(0)}
                      className="text-xs bg-slate-800 text-slate-300 px-2.5 py-1.5 rounded-lg"
                    >
                      Reset Clock
                    </button>
                  )}
                </div>
              </div>

              {snoozedCards.length === 0 ? (
                <p className="text-sm text-slate-400 py-8 text-center">
                  No cards are currently snoozed. Click "Comfortable — Hide / Snooze" during practice to park mastered cards here.
                </p>
              ) : (
                <div className="space-y-2.5">
                  {snoozedCards.map((c) => (
                    <div
                      key={c.id}
                      className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 bg-slate-950/70 p-3.5 rounded-xl border border-slate-800"
                    >
                      <div>
                        <p className="text-sm font-semibold text-white">{c.en}</p>
                        <p className="text-xs text-amber-300">{c.hiRoman} · <span className="text-slate-400">{c.hiDeva}</span></p>
                      </div>
                      <div className="flex items-center gap-2">
                        <span className="text-xs bg-emerald-950 text-emerald-300 border border-emerald-800 px-2.5 py-1 rounded-md">
                          {formatRemainingDays(c.snoozeUntil)}
                        </span>
                        <button
                          onClick={() => restoreCard(c.id)}
                          className="text-xs bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-slate-200 px-3 py-1.5 rounded-lg font-medium transition"
                        >
                          Restore Now
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* ADD CARDS TAB */}
          {activeTab === "add" && (
            <div className="space-y-6">
              <form onSubmit={handleAddSingle} className="bg-slate-900 rounded-2xl border border-slate-800 p-5 space-y-4">
                <h2 className="text-lg font-bold text-white">Add a New Flashcard</h2>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">English Prompt *</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g., I can come tomorrow."
                      value={newEn}
                      onChange={(e) => setNewEn(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white"
                    />
                  </div>
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Spoken Hindi (Roman) *</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g., Main kal aa sakta hoon."
                      value={newHiRoman}
                      onChange={(e) => setNewHiRoman(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white"
                    />
                  </div>
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Devanagari (Optional — for audio)</label>
                    <input
                      type="text"
                      placeholder="e.g., मैं कल आ सकता हूँ।"
                      value={newHiDeva}
                      onChange={(e) => setNewHiDeva(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Week Tag</label>
                      <input
                        type="text"
                        value={newWeek}
                        onChange={(e) => setNewWeek(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white"
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Category</label>
                      <input
                        type="text"
                        value={newCategory}
                        onChange={(e) => setNewCategory(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white"
                      />
                    </div>
                  </div>
                </div>
                <button
                  type="submit"
                  className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-sm px-5 py-2.5 rounded-xl transition"
                >
                  + Save Card to Deck
                </button>
              </form>

              {/* Bulk Paste */}
              <div className="bg-slate-900 rounded-2xl border border-slate-800 p-5 space-y-3">
                <h3 className="text-base font-bold text-white">Bulk Paste Future Weeks</h3>
                <p className="text-xs text-slate-400">
                  Paste one card per line separated by <code className="text-amber-300">|</code> in the format: <br />
                  <code className="text-slate-300">English | Roman Hindi | Devanagari | Week | Category</code>
                </p>
                <textarea
                  rows={4}
                  placeholder="Do you know? | Kya aapko pata hai? | क्या आपको पता है? | Week 2 | Needs & Knowledge"
                  value={bulkText}
                  onChange={(e) => setBulkText(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs sm:text-sm text-white font-mono"
                />
                <button
                  onClick={handleBulkImport}
                  className="bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-slate-200 font-semibold text-xs sm:text-sm px-4 py-2 rounded-xl border border-slate-700 transition"
                >
                  Import Bulk Lines
                </button>
              </div>
            </div>
          )}

          {/* MANAGE ALL TAB */}
          {activeTab === "manage" && (
            <div className="bg-slate-900 rounded-2xl border border-slate-800 p-5">
              <div className="flex items-center justify-between pb-4 mb-4 border-b border-slate-800">
                <h2 className="text-lg font-bold text-white">All Cards ({cards.length})</h2>
                <button
                  onClick={() => {
                    if (confirm("Reset deck back to the original 25 Week 1 cards?")) {
                      setCards(INITIAL_CARDS);
                      setSimulatedOffsetDays(0);
                    }
                  }}
                  className="text-xs text-rose-400 hover:underline"
                >
                  Reset to Default 25
                </button>
              </div>
              <div className="space-y-2 max-h-[480px] overflow-y-auto pr-1">
                {cards.map((c) => {
                  const snoozed = isCardSnoozed(c);
                  return (
                    <div
                      key={c.id}
                      className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 bg-slate-950/70 p-3 rounded-xl border border-slate-800"
                    >
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="text-[11px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded">
                            {c.week}
                          </span>
                          <span className="text-sm font-semibold text-white">{c.en}</span>
                        </div>
                        <p className="text-xs text-amber-300 mt-0.5">
                          {c.hiRoman} <span className="text-slate-400">({c.hiDeva})</span>
                        </p>
                      </div>
                      <div className="flex items-center gap-2">
                        {snoozed ? (
                          <button
                            onClick={() => restoreCard(c.id)}
                            className="text-xs bg-emerald-950 text-emerald-300 border border-emerald-800 px-2.5 py-1 rounded-lg"
                          >
                            Snoozed (Restore)
                          </button>
                        ) : (
                          <button
                            onClick={() => snoozeCard(c.id, 14)}
                            className="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-lg"
                          >
                            Snooze 2w
                          </button>
                        )}
                        <button
                          onClick={() => deleteCard(c.id)}
                          className="text-xs text-rose-400 hover:bg-rose-950/60 px-2 py-1 rounded-lg"
                        >
                          Delete
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
